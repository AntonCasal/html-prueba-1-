<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <nav> <a href="/index.html">Página general</a></nav>
    <form action="/forms.index.html"method="get">
      <ul>
        <li>
             <label for="login">Usuario</label>
            <input type="text" name="login" placeholder="tu usuario de la aplicación">
            
        </li>
        <li>
            <label for="password">Tu Contraseña</label>
            <input type="password" name="password" placeholder="tu contraseña">
        </li>
        <li>
            <label for="mail">Tu Correo Electrónico</label>
            <input type="email" name="mail" placeholder="tu correo electrónico">

        </li>
        <li>
         <label for="estimation">Estimación:</label>
            <select name="estimation">
                <option value="1">XS</option>
                <option value="2">S</option>
                <option value="3">M</option>
                <option value="4">L</option>
                <option value="5">XL</option>
            </select>
        </li>
        <li>
            <label for="payment">Tipo de pago:</label>
            <input name="payment" type="checkbox" value="tarjeta">Tarjeta</input>
            <input name="payment" type="checkbox" value="paypal">Paypal</input>
            <input name="payment" type="checkbox" value="transferencia">Transferencia</input>
        </li>
    
     <button type="submit"> Enviar </button>
    <button type="reset"> Limpiar </button>
     </form>
</body>
</html>
