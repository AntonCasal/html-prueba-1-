<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <nav><a href="../index.html"> Volver atrás</a></nav>                                    
    <h1>Ejemplos de Tablas</h1>
    <table border="1">
        <caption> Titulo de la tabla simple </caption>
    
        <tr>
            <th>Encabezado 1</th>
            <th>Encabezado 2</th>
            <th>Encabezado 3</th>
        </tr>
        <tr>
            <td>Celda 1</td>
            <td>Celda 2</td>
            <td>Celda 3</td>
        </tr>
        <tr>
            <td>Celda4</td>
            <td>Celda5</td>
            <td>Celda6</td>
        </tr>
        <tr>
            <td>Celda7</td>
            <td>Celda8</td>
            <td>Celda9</td>
        </tr>
        </table>
       <h1> Ejemplo de tabla combinada </h1> 
       <table border="1">
        <caption> Titulo de la tabla combinada </caption>
        <tr>
            <td colspan="2">Encabezado 1</td>
            <td rowspan="2">Encabezado 3</td>
        </tr>
        <tr>
            <td>Celda 1</td>
            <td>Celda 2</td>
        </tr>
        <tr>
            <td colspan="2">Celda combinada</td>
        </tr>
        <tr>
            <td>Celda 4</td>
        </tr>
    </table>

</body>
</html>
